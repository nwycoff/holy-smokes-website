<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Treehouse app: social images</title>
<!-- Source for assets/marketing/treehouse-app-square.png (1080×1080 feed post) and
     treehouse-app-story.png (1080×1920 story): scripts/marketing-images.mjs screenshots each frame.
     Same look as app-flyer.html. Kept to the app itself (no products, prices or discounts) so
     posts stay within Instagram and Facebook rules for cannabis businesses. -->
<style>
  :root { --forest: #213b2c; --deep: #192e22; --cream: #f6f3eb; --paper: #fffcf6; --gold: #bd8d4a;
    --green: #547442; --lime: #8cc63f; --soft: #e8ecde; --ink: #26382b; --muted: #5f6b60; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ccc; font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); }
  .frame { width: 1080px; background: var(--forest); color: var(--cream); display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .square { height: 1080px; padding: 72px 80px 60px; }
  .story { height: 1920px; padding: 200px 90px 170px; }
  .frame::before { content: ""; position: absolute; width: 900px; height: 900px; border-radius: 50%; background: var(--deep); right: -380px; top: -380px; }
  .frame > * { position: relative; }

  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 96px; height: 96px; border-radius: 50%; }
  .brand p { font-size: 22px; letter-spacing: 6px; font-weight: 700; color: var(--lime); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; line-height: 1.04; }
  h1 em { color: #cfe3a7; }
  .square h1 { font-size: 92px; margin: 44px 0 0; }
  .story h1 { font-size: 108px; margin: 64px 0 0; }

  .perks { list-style: none; display: grid; }
  .square .perks { grid-template-columns: 1fr 1fr; gap: 18px 28px; margin-top: 46px; }
  .story .perks { gap: 24px; margin-top: 64px; }
  .perks li { display: flex; align-items: center; gap: 18px; font-size: 31px; line-height: 1.2; }
  .story .perks li { font-size: 42px; gap: 26px; }
  .perks i { flex: none; width: 62px; height: 62px; border-radius: 50%; background: var(--soft); display: flex; align-items: center; justify-content: center; }
  .story .perks i { width: 84px; height: 84px; }
  .perks svg { width: 34px; height: 34px; stroke: var(--forest); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .story .perks svg { width: 46px; height: 46px; }

  .gift { border: 3px dashed var(--gold); border-radius: 24px; background: #2b4a37; color: var(--cream); }
  .square .gift { margin-top: 40px; padding: 20px 28px; font-size: 28px; }
  .story .gift { margin: 64px 0 56px; padding: 34px 40px; font-size: 40px; line-height: 1.3; }
  .gift b { color: #f0d39f; }

  .cta { margin-top: auto; background: var(--paper); color: var(--forest); border-radius: 26px; text-align: center; }
  .square .cta { padding: 26px; }
  .story .cta { padding: 46px 30px; }
  .cta small { display: block; font-size: 22px; letter-spacing: 5px; font-weight: 800; color: var(--green); }
  .story .cta small { font-size: 30px; }
  .cta strong { display: block; font-family: Georgia, serif; font-weight: 400; font-size: 58px; margin: 8px 0 4px; }
  .story .cta strong { font-size: 58px; margin: 14px 0 8px; }
  .cta span { font-size: 24px; color: var(--muted); }
  .story .cta span { font-size: 32px; }

  .fine { font-size: 19px; color: #c9cfc3; margin-top: 22px; text-align: center; line-height: 1.4; }
  .story .fine { font-size: 27px; margin-top: 40px; }
</style>
</head>
<body>
<!-- Shared content, laid out for each format -->
<template id="content">
  <div class="brand"><img src="treehouse-logo.png" alt=""><p>THE MY TREEHOUSE APP</p></div>
  <h1>Your Treehouse,<br><em>right on your phone.</em></h1>
  <ul class="perks">
    <li><i><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></i>Order ahead for pickup</li>
    <li><i><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></i>Your points, anytime</li>
    <li><i><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></i>Ready-for-pickup alerts</li>
    <li><i><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="1.5"/><path d="M3 8h18v3H3zM12 8v12M12 8c-1.5-3-5-3.5-5-1.2C7 8 9.5 8 12 8zm0 0c1.5-3 5-3.5 5-1.2C17 8 14.5 8 12 8z"/></svg></i>Birthday treats</li>
  </ul>
  <p class="gift">Turn on <b>Deals &amp; news</b> in the app and we’ll send you a <b>welcome gift</b>.</p>
  <div class="cta"><small>GET THE APP · FREE</small><strong>treehousepharmacy.com/app</strong><span>No app store needed · add it to your Home Screen</span></div>
  <p class="fine">For registered medical marijuana patients · Treehouse Pharmacy · 1801 N Union St, Ponca City</p>
</template>
<section class="frame square" id="square"></section>
<section class="frame story" id="story"></section>
<script>
  for (const id of ['square', 'story']) document.getElementById(id).append(document.getElementById('content').content.cloneNode(true));
</script>
</body>
</html>
